spec: "1"
databases:
  - name: blitz-link-db
    plan: starter
services:
  - type: web
    name: blitz-link-api
    env: docker
    repo: https://github.com/TailoredAgents/TWblitzmode.git
    autoDeploy: true
    plan: starter
    region: oregon
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase: blitz-link-db
        property: connectionString
      - key: PRIMARY_MODEL
        value: gpt-4.1
      - key: OPENAI_API_KEY
        sync: false
      - key: APIFY_TOKEN
        sync: false
      - key: CUFINDER_API_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_VERIFIED_SENDER
        sync: false
      - key: ENC_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
    buildCommand: docker build -t blitz-link-api .
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port 8888

  - type: web
    name: blitz-link-frontend
    env: node
    repo: https://github.com/TailoredAgents/TWblitzmode.git
    autoDeploy: true
    plan: starter
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService: blitz-link-api
        property: url
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: NEXT_PUBLIC_MASTER_LOGIN_PASSWORD
        value: Tallwave

