spec: 1
databases:
  - name: blitz-link-db
    plan: starter
services:
  - type: keyvalue
    name: blitz-link-redis
    plan: starter
    region: oregon
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: blitz-link-api
    env: docker
    repo: https://github.com/TailoredAgents/TWblitzmode.git
    autoDeploy: true
    plan: starter
    region: oregon
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: blitz-link-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: blitz-link-redis
          property: connectionString
      - key: PRIMARY_MODEL
        value: gpt-4.1
      - key: OPENAI_API_KEY
        sync: false
      - key: APIFY_TOKEN
        sync: false
      - key: CUFINDER_API_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_VERIFIED_SENDER
        sync: false
      - key: ENC_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
    buildCommand: docker build -t blitz-link-api .
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port 8888

  - type: web
    name: blitz-link-frontend
    env: node
    repo: https://github.com/TailoredAgents/TWblitzmode.git
    autoDeploy: true
    plan: starter
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: blitz-link-api
          type: web
          property: url
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: NEXT_PUBLIC_MASTER_LOGIN_PASSWORD
        value: Tallwave

  - type: worker
    name: blitz-link-worker
    env: docker
    repo: https://github.com/TailoredAgents/TWblitzmode.git
    autoDeploy: true
    plan: starter
    region: oregon
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: blitz-link-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: blitz-link-redis
          property: connectionString
      - key: PRIMARY_MODEL
        value: gpt-4.1
      - key: OPENAI_API_KEY
        sync: false
      - key: APIFY_TOKEN
        sync: false
      - key: CUFINDER_API_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_VERIFIED_SENDER
        sync: false
      - key: ENC_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
    buildCommand: docker build -t blitz-link-worker .
    startCommand: python3 -m services.queue_worker

