name: CI
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps (best effort)
        run: |
          pip install -r requirements.txt || true
      - name: Provider preflight (env required)
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          CUFINDER_API_KEY: ${{ secrets.CUFINDER_API_KEY }}
          PHANTOMBUSTER_API_KEY: ${{ secrets.PHANTOMBUSTER_API_KEY }}
        run: |
          python blitz/scripts/provider_preflight.py || true
      - name: Policy gates
        run: |
          rg -n "(from|import)\s+api\.auth|jwt_secret_manager|\bjwt\b|refresh_token|auth_sessions" . && exit 1 || true
          rg -n "(SendGrid|sendgrid)" services || exit 1
          rg -n "run_phantombuster_enrichment" services/chat_tool_registry.py || exit 1
          rg -n "\bprint\(" api services | wc -l | grep '^0$' || (echo "print() calls found in backend" && exit 1)

